[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

# Always revalidate the cross-sell script so a new deploy takes effect
# immediately. Without this, browsers and the Netlify CDN cache the static
# JS aggressively and keep serving a stale copy after each update.
# "max-age=0, must-revalidate" lets the browser keep the file but check the
# ETag on every load — it gets a fast 304 when unchanged, the new file when
# it changed. No version query string needed in the Webflow <script src>.
[[headers]]
  for = "/crossell-popup.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same revalidate policy for the Omnisend tracking scripts so template/Webflow
# <script src> tags pick up new deploys immediately (fast 304 when unchanged).
[[headers]]
  for = "/omnisend-identify.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/omnisend-add-to-cart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/omnisend-started-checkout.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Subscription-management script for the Webflow "Manage Subscriptions" page —
# same revalidate policy so Webflow picks up new deploys immediately.
[[headers]]
  for = "/manage-subscriptions.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Back-in-stock widget for the Webflow product template — same revalidate policy.
[[headers]]
  for = "/back-in-stock.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Header instant-search script — same revalidate policy, so a fix reaches the site on
# the next page load without editing the Webflow footer or busting a query string.
[[headers]]
  for = "/search-dropdown.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Back-in-stock notifier: once a day at 4pm Central it checks Airtable inventory for
# Pending signups and triggers the Rejoiner restock-alert journey for restocks.
# Netlify cron is UTC-only with no DST handling, and 4pm Central is 21:00 UTC in
# summer (CDT) but 22:00 UTC in winter (CST). So we fire at BOTH hours and the
# function itself drops the wrong one (it proceeds only when the America/Chicago
# hour is 16 — see BIS_SEND_HOUR / BIS_TZ in back-in-stock-notify.js). Exactly one
# sweep per day runs year-round. Manual HTTP invocations skip the hour check.
[functions."back-in-stock-notify"]
  schedule = "0 21,22 * * *"

# Daily subscription stock check. Foxy bills all renewals ~7am store-local and does
# NOT check inventory first. This runs each weekday MORNING (after 7am, business
# hours — no middle-of-night pings) and reports the UPCOMING renewals (tomorrow;
# Friday covers Sat/Sun/Mon) so there's lead time to restock before they bill.
# "0 14 * * 1-5" = 14:00 UTC Mon–Fri = 9am CDT / 8am CST — after 7am Central
# year-round and inside the 7am–7pm post window enforced in the function. If the
# store timezone is NOT Central, revisit this hour together with the FOXY_TZ env var.
[functions."subscription-stock-check"]
  schedule = "0 14 * * 1-5"

# NOTE: the search index schedule lives in functions/search-index-build.mts as an
# exported `config`, not here — v2 functions declare it in code, and one source of
# truth beats two.


